<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- stylized hills -->
  <path d="M0 780 Q 320 620 640 760 T 1280 740 T 1920 700 L1920 1080 L0 1080 Z" fill="#0f172a" fill-opacity="0.55"/>
  <path d="M0 880 Q 400 740 860 860 T 1920 840 L1920 1080 L0 1080 Z" fill="#020617" fill-opacity="0.7"/>
  <!-- sun/moon disc -->
  <circle cx="1500" cy="250" r="90" fill="#fbbf24" fill-opacity="0.85"/>
  <circle cx="1500" cy="250" r="140" fill="#fbbf24" fill-opacity="0.12"/>
</svg>
